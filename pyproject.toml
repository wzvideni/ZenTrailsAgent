[project]
name = "zen-trails-agent"
version = "0.1.0"
description = "Zen Trails AI 控制：BepInEx 进程内注入 + MCP 工具，让 AI Agent 驱动游戏"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10.0",          # 截图缩放，供 vision 模型内联读取
]

[project.scripts]
zen-trails-agent = "zentrails_agent.server:main"

[dependency-groups]
# 资源逆向（反射/IL 反编译）时按需安装
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["zentrails_agent"]
